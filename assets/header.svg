<svg width="850" height="170" viewBox="0 0 850 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente de Borda e Fundo -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Padrão do Grid de Código -->
    <pattern id="codeGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08" />
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <!-- Clip Path Arredondado para não vazar a animação -->
    <clipPath id="cardClip">
      <rect width="848" height="168" rx="12" x="1" y="1" />
    </clipPath>

    <style>
      .bg-grid {
        animation: gridMove 20s linear infinite;
      }
      .code-line {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 11px;
        fill: #38bdf8;
        opacity: 0.16;
        user-select: none;
      }
      .code-stream {
        animation: streamFlow 25s linear infinite;
      }
      .scanline {
        animation: scan 8s ease-in-out infinite alternate;
      }
      @keyframes gridMove {
        0% { transform: translateY(0); }
        100% { transform: translateY(30px); }
      }
      @keyframes streamFlow {
        0% { transform: translateY(0); }
        100% { transform: translateY(-75px); }
      }
      @keyframes scan {
        0% { opacity: 0.05; transform: translateY(-10px); }
        100% { opacity: 0.20; transform: translateY(170px); }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 34px;
        font-weight: 700;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .title-code {
        font-family: 'Fira Code', monospace;
        color: #38bdf8;
        fill: #38bdf8;
        font-weight: 500;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 15px;
        font-weight: 400;
        fill: #94a3b8;
        letter-spacing: 0.3px;
      }
      .subtitle-hl {
        fill: #38bdf8;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Card Principal -->
  <g clip-path="url(#cardClip)">
    <!-- Fundo Escuro -->
    <rect width="848" height="168" rx="12" x="1" y="1" fill="url(#cardGrad)" />

    <!-- Grid Digital Animado no Fundo -->
    <g class="bg-grid">
      <rect x="-30" y="-30" width="910" height="230" fill="url(#codeGrid)" />
    </g>

    <!-- Linhas de Código Deslizando Suavemente no Fundo -->
    <g class="code-stream">
      <text x="25" y="30" class="code-line">const dev = { name: "Pedro Vinícius", focus: ["Web", "Cloud"] };</text>
      <text x="500" y="55" class="code-line">&lt;Stack front="React, Next" back="Spring, Python" /&gt;</text>
      <text x="60" y="80" class="code-line">async function deploySolutions() { await architect(); return deliver(); }</text>
      <text x="450" y="105" class="code-line">while (learning) { explore({ modernUI, cleanArchitecture }); }</text>
      <text x="40" y="130" class="code-line">database.connect({ mongodb, postgresql, supabase });</text>
      <text x="520" y="155" class="code-line">git.commit({ status: "clean", test: "passed" });</text>
      <!-- Linhas repetidas para loop contínuo -->
      <text x="25" y="180" class="code-line">const dev = { name: "Pedro Vinícius", focus: ["Web", "Cloud"] };</text>
      <text x="500" y="205" class="code-line">&lt;Stack front="React, Next" back="Spring, Python" /&gt;</text>
      <text x="60" y="230" class="code-line">async function deploySolutions() { await architect(); return deliver(); }</text>
    </g>

    <!-- Brilho Radial Central -->
    <circle cx="425" cy="85" r="300" fill="url(#centerGlow)" />

    <!-- Linha de Scan Suave -->
    <rect x="0" y="0" width="850" height="2" fill="#38bdf8" class="scanline" />

    <!-- Botões de Janela de Código / Terminal (Canto Superior Esquerdo) -->
    <circle cx="28" cy="22" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="44" cy="22" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="60" cy="22" r="5" fill="#10b981" opacity="0.8" />
    <text x="80" y="26" font-family="'Fira Code', monospace" font-size="11" fill="#64748b" opacity="0.7">~/pvssdev/profile (main)</text>

    <!-- Conteúdo Estático de Primeiro Plano -->
    <text x="425" y="82" text-anchor="middle" class="title-text">
      <tspan class="title-code">&lt;&nbsp;</tspan>Pedro Vinícius<tspan class="title-code">&nbsp;/&gt;</tspan>
    </text>

    <text x="425" y="118" text-anchor="middle" class="subtitle-text">
      Full Stack Developer <tspan class="subtitle-hl">&bull;</tspan> Analysis and Systems Development student
    </text>
  </g>

  <!-- Borda Sutil com Gradiente -->
  <rect width="848" height="168" rx="12" x="1" y="1" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />
</svg>
