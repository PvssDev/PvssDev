<svg width="850" height="8" viewBox="0 0 850 8" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Máscara com fade in e fade out amplo nas extremidades -->
    <linearGradient id="maskGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="18%" stop-color="#ffffff" />
      <stop offset="82%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <mask id="edgeFade1">
      <rect x="0" y="0" width="850" height="8" fill="url(#maskGrad1)" />
    </mask>

    <!-- Gradiente fino: zona quase apagada (opacidade 0.08) e feixe de luz suave em loop de 7.5s -->
    <linearGradient id="flowGrad1" x1="-80%" y1="0%" x2="120%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.08">
        <animate attributeName="stop-color" values="#6d28d9; #a855f7; #6d28d9" dur="7.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="25%" stop-color="#7c3aed" stop-opacity="0.12" />
      <stop offset="45%" stop-color="#c084fc" stop-opacity="0.85">
        <animate attributeName="stop-color" values="#c084fc; #e879f9; #c084fc" dur="7.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="60%" stop-color="#f3e8ff" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="88%" stop-color="#6d28d9" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.08" />
      <animate attributeName="x1" values="-80%; 40%; 160%" dur="7.5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="120%; 240%; 360%" dur="7.5s" repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <g mask="url(#edgeFade1)">
    <!-- Linha fina de 1.1px -->
    <rect x="0" y="3.4" width="850" height="1.1" fill="url(#flowGrad1)" rx="0.55" />
  </g>
</svg>
