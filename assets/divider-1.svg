<svg width="850" height="8" viewBox="0 0 850 8" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Máscara de fade in e fade out nas pontas -->
    <linearGradient id="maskGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="18%" stop-color="#ffffff" />
      <stop offset="82%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <mask id="edgeFade1">
      <rect x="0" y="0" width="850" height="8" fill="url(#maskGrad1)" />
    </mask>

    <!-- Gradiente com vaivém contínuo suave (sem saltos bruscos) -->
    <linearGradient id="flowGrad1" x1="-50%" y1="0%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.15" />
      <stop offset="35%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.9">
        <animate attributeName="stop-color" values="#c084fc; #e879f9; #f3e8ff; #c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="65%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.15" />
      
      <!-- Animação de ida e volta fluida em 8s (começa e termina no mesmo ponto) -->
      <animate attributeName="x1" values="-60%; 60%; -60%" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
      <animate attributeName="x2" values="40%; 160%; 40%" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
    </linearGradient>
  </defs>

  <g mask="url(#edgeFade1)">
    <!-- Linha base de sustentação sutil para nunca apagar 100% do nada -->
    <rect x="0" y="3.4" width="850" height="1.1" fill="#7c3aed" opacity="0.12" rx="0.55" />
    <!-- Feixe de luz em movimento fluido e contínuo -->
    <rect x="0" y="3.4" width="850" height="1.1" fill="url(#flowGrad1)" rx="0.55" />
  </g>
</svg>
