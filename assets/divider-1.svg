<svg width="850" height="10" viewBox="0 0 850 10" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Máscara de fade in e fade out nas extremidades -->
    <linearGradient id="maskGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="12%" stop-color="#ffffff" />
      <stop offset="88%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <mask id="edgeFade1">
      <rect x="0" y="0" width="850" height="10" fill="url(#maskGrad1)" />
    </mask>

    <!-- Gradiente que muda de cor e desliza organicamente da esquerda para a direita -->
    <linearGradient id="flowGrad1" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9">
        <animate attributeName="stop-color" values="#6d28d9; #a855f7; #e879f9; #c084fc; #6d28d9" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="25%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7; #c084fc; #f3e8ff; #e879f9; #a855f7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc; #e879f9; #c084fc; #a855f7; #c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#e879f9">
        <animate attributeName="stop-color" values="#e879f9; #6d28d9; #a855f7; #f3e8ff; #e879f9" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#6d28d9">
        <animate attributeName="stop-color" values="#6d28d9; #a855f7; #e879f9; #c084fc; #6d28d9" dur="8s" repeatCount="indefinite" />
      </stop>
      <animate attributeName="x1" values="-100%; 0%; 100%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%; 200%; 300%" dur="8s" repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <!-- Linha visível e nítida com máscara de fade nas bordas -->
  <g mask="url(#edgeFade1)">
    <!-- Linha de base brilhante -->
    <rect x="0" y="4" width="850" height="2" fill="url(#flowGrad1)" rx="1" />
  </g>
</svg>
