<svg width="850" height="10" viewBox="0 0 850 10" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Máscara de fade in e fade out nas extremidades -->
    <linearGradient id="maskGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="10%" stop-color="#ffffff" />
      <stop offset="90%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <mask id="edgeFade3">
      <rect x="0" y="0" width="850" height="10" fill="url(#maskGrad3)" />
    </mask>

    <!-- Gradiente radial expansivo que pulsa e respira suavemente do centro para as bordas -->
    <linearGradient id="flowGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b0764">
        <animate attributeName="stop-color" values="#3b0764; #6d28d9; #a855f7; #6d28d9; #3b0764" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="35%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6; #c084fc; #e9d5ff; #c084fc; #8b5cf6" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#f3e8ff">
        <animate attributeName="stop-color" values="#f3e8ff; #e879f9; #c084fc; #a855f7; #f3e8ff" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="65%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6; #c084fc; #e9d5ff; #c084fc; #8b5cf6" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#3b0764">
        <animate attributeName="stop-color" values="#3b0764; #6d28d9; #a855f7; #6d28d9; #3b0764" dur="7s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <style>
      .pulse-line {
        animation: breathPulse 7s ease-in-out infinite alternate;
      }
      @keyframes breathPulse {
        0% { opacity: 0.65; transform: scaleY(0.9); }
        50% { opacity: 1; transform: scaleY(1.3); }
        100% { opacity: 0.65; transform: scaleY(0.9); }
      }
    </style>
  </defs>

  <g mask="url(#edgeFade3)">
    <rect x="0" y="4" width="850" height="2" fill="url(#flowGrad3)" rx="1" class="pulse-line" />
  </g>
</svg>
