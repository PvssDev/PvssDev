<svg width="850" height="8" viewBox="0 0 850 8" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Máscara com fade in e fade out nas pontas -->
    <linearGradient id="maskGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="20%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <mask id="edgeFade2">
      <rect x="0" y="0" width="850" height="8" fill="url(#maskGrad2)" />
    </mask>

    <!-- Gradiente reverso bem lento (11.5s) com trecho quase apagado (0.05) -->
    <linearGradient id="flowGrad2" x1="160%" y1="0%" x2="-40%" y2="0%">
      <stop offset="0%" stop-color="#3b0764" stop-opacity="0.05" />
      <stop offset="20%" stop-color="#581c87" stop-opacity="0.08" />
      <stop offset="40%" stop-color="#9333ea" stop-opacity="0.25" />
      <stop offset="55%" stop-color="#d946ef" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#d946ef; #c084fc; #f3e8ff; #d946ef" dur="11.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#f3e8ff" stop-opacity="0.9" />
      <stop offset="85%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.05" />
      <animate attributeName="x1" values="160%; 40%; -80%" dur="11.5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="-40%; -160%; -280%" dur="11.5s" repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <g mask="url(#edgeFade2)">
    <!-- Linha ultrafina de 1.0px -->
    <rect x="0" y="3.5" width="850" height="1.0" fill="url(#flowGrad2)" rx="0.5" />
  </g>
</svg>
