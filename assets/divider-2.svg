<svg width="850" height="8" viewBox="0 0 850 8" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Máscara de fade in e fade out nas pontas -->
    <linearGradient id="maskGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="20%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <mask id="edgeFade2">
      <rect x="0" y="0" width="850" height="8" fill="url(#maskGrad2)" />
    </mask>

    <!-- Gradiente reverso contínuo (vai e volta em 11s, sem saltos) -->
    <linearGradient id="flowGrad2" x1="50%" y1="0%" x2="150%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#9333ea" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#d946ef" stop-opacity="0.85">
        <animate attributeName="stop-color" values="#d946ef; #c084fc; #f3e8ff; #d946ef" dur="11s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#9333ea" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.1" />
      
      <!-- Animação reverso e retorno contínuo em 11s -->
      <animate attributeName="x1" values="60%; -60%; 60%" dur="11s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
      <animate attributeName="x2" values="160%; 40%; 160%" dur="11s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
    </linearGradient>
  </defs>

  <g mask="url(#edgeFade2)">
    <!-- Linha base de sustentação sutil -->
    <rect x="0" y="3.5" width="850" height="1.0" fill="#9333ea" opacity="0.1" rx="0.5" />
    <!-- Feixe suave reverso contínuo -->
    <rect x="0" y="3.5" width="850" height="1.0" fill="url(#flowGrad2)" rx="0.5" />
  </g>
</svg>
