<svg width="850" height="8" viewBox="0 0 850 8" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Máscara de fade in e fade out nas pontas -->
    <linearGradient id="maskGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="15%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <mask id="edgeFade4">
      <rect x="0" y="0" width="850" height="8" fill="url(#maskGrad4)" />
    </mask>

    <!-- Gradiente que viaja suavemente e retorna em 9.5s contínuos -->
    <linearGradient id="flowGrad4" x1="-30%" y1="0%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.1" />
      <stop offset="25%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.85">
        <animate attributeName="stop-color" values="#c084fc; #f3e8ff; #e879f9; #c084fc" dur="9.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#7c3aed" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.1" />
      
      <!-- Animação contínua de vaivém suave em 9.5s -->
      <animate attributeName="x1" values="-50%; 50%; -50%" dur="9.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
      <animate attributeName="x2" values="50%; 150%; 50%" dur="9.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
    </linearGradient>
  </defs>

  <g mask="url(#edgeFade4)">
    <!-- Linha base de sustentação sutil -->
    <rect x="0" y="3.4" width="850" height="1.1" fill="#6d28d9" opacity="0.1" rx="0.55" />
    <!-- Feixe com vaivém contínuo -->
    <rect x="0" y="3.4" width="850" height="1.1" fill="url(#flowGrad4)" rx="0.55" />
  </g>
</svg>
