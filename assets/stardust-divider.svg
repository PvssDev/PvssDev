<svg width="850" height="24" viewBox="0 0 850 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente da Linha Central com Fade nas Pontas -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0" />
      <stop offset="25%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.75" />
      <stop offset="75%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Brilho Suave de Partícula -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3e8ff" stop-opacity="1" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="particlePurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e9d5ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <style>
      .star-twinkle-1 {
        animation: twinkle 3.2s ease-in-out infinite alternate;
      }
      .star-twinkle-2 {
        animation: twinkle 4.5s ease-in-out infinite alternate;
        animation-delay: 1.2s;
      }
      .star-twinkle-3 {
        animation: twinkle 2.8s ease-in-out infinite alternate;
        animation-delay: 0.6s;
      }
      .star-float-1 {
        animation: floatParticle 5s ease-in-out infinite alternate;
      }
      .star-float-2 {
        animation: floatParticle 6.5s ease-in-out infinite alternate;
        animation-delay: 2s;
      }
      .star-pulse {
        animation: starPulse 4s ease-in-out infinite;
      }

      @keyframes twinkle {
        0% { opacity: 0.2; transform: scale(0.7); }
        50% { opacity: 0.9; transform: scale(1.1); }
        100% { opacity: 0.3; transform: scale(0.8); }
      }

      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-2px) translateX(1px); opacity: 0.85; }
        100% { transform: translateY(2px) translateX(-1px); opacity: 0.4; }
      }

      @keyframes starPulse {
        0% { opacity: 0.4; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.25); }
        100% { opacity: 0.4; transform: scale(0.85); }
      }
    </style>
  </defs>

  <!-- Linha Central Guia com Fade Suave -->
  <line x1="50" y1="12" x2="800" y2="12" stroke="url(#lineGrad)" stroke-width="1" />

  <!-- Estrela Central / Diamante Sutil com Brilho -->
  <g class="star-pulse" transform-origin="425 12">
    <circle cx="425" cy="12" r="5" fill="url(#starGlow)" />
    <!-- Pequena Cruz de Luz Cósmica -->
    <path d="M 425 7 L 426 12 L 430 12 L 426 13 L 425 17 L 424 13 L 420 12 L 424 12 Z" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Partículas Esquerda -->
  <circle cx="120" cy="11" r="1.2" fill="#c084fc" class="star-twinkle-1" />
  <circle cx="180" cy="14" r="1.8" fill="#e9d5ff" class="star-float-1" />
  <circle cx="230" cy="9"  r="1.4" fill="url(#starGlow)" class="star-twinkle-2" />
  <circle cx="280" cy="13" r="1"   fill="#a855f7" class="star-twinkle-3" />
  <circle cx="330" cy="10" r="2"   fill="url(#starGlow)" class="star-float-2" />
  <circle cx="370" cy="14" r="1.5" fill="#e9d5ff" class="star-twinkle-1" />
  <circle cx="400" cy="11" r="1.2" fill="#c084fc" class="star-twinkle-2" />

  <!-- Partículas Direita -->
  <circle cx="450" cy="13" r="1.3" fill="#c084fc" class="star-twinkle-2" />
  <circle cx="480" cy="10" r="1.6" fill="#e9d5ff" class="star-twinkle-1" />
  <circle cx="520" cy="14" r="2"   fill="url(#starGlow)" class="star-float-1" />
  <circle cx="570" cy="11" r="1"   fill="#a855f7" class="star-twinkle-3" />
  <circle cx="620" cy="9"  r="1.5" fill="url(#starGlow)" class="star-twinkle-2" />
  <circle cx="670" cy="13" r="1.7" fill="#e9d5ff" class="star-float-2" />
  <circle cx="730" cy="11" r="1.2" fill="#c084fc" class="star-twinkle-1" />
</svg>
